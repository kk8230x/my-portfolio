<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송이 | 포트폴리오</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --main: #0d657a; --sub: #2f4858; --white: #ffffff; --black: #000000;
    --gray-muted: #666666; --gray-line: #d9d9d9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; background: var(--white); color: var(--sub); line-height: 1.6; }
  header { width: 100%; max-width: 720px; margin: 0 auto; padding: 32px 16px 16px; border-bottom: 2px solid var(--main); }
  header strong { font-size: 1.25rem; color: var(--black); }
  main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 80px 16px; display: flex; flex-direction: column; justify-content: center; }
  .code { margin: 0; color: var(--main); font-weight: 700; font-size: 1rem; letter-spacing: .1em; }
  h1 { margin: 8px 0 12px; font-size: clamp(2.2rem, 8vw, 3.5rem); line-height: 1.2; color: var(--black); }
  p.msg { margin: 0 0 32px; color: var(--gray-muted); font-size: 1.1rem; padding-bottom: 24px; border-bottom: 1px solid var(--gray-line); }
  .btn { align-self: flex-start; display: inline-block; background: var(--main); color: var(--white); text-decoration: none; font-weight: 600; padding: 12px 28px; border-radius: 999px; }
  .btn:hover, .btn:focus-visible { background: var(--sub); }
</style>
</head>
<body>
<header><strong>Tennis.Date</strong></header>
<main>
  <p class="code">404</p>
  <h1>페이지를 찾을 수 없어요</h1>
  <p class="msg">주소를 다시 확인해 주세요</p>
  <a class="btn" href="plan-draft.html">홈으로 가기</a>
</main>
</body>
</html>
